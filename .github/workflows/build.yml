name: Build Repo

on:
  push:
    paths:
      - 'debs/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install dpkg-scanpackages
      run: sudo apt-get update && sudo apt-get install -y dpkg-dev

    - name: Generate Packages
      run: dpkg-scanpackages debs /dev/null > Packages

    - name: Compress Packages.bz2
      run: bzip2 -fks Packages

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add Packages Packages.bz2
        git commit -m "Auto-update Packages" || echo "No changes to commit"
        git push
